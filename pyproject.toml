[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "traceclean"
version = "0.1.0"
description = "TraceClean implementation for image classification with noisy labels"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch>=2.6,<3",
    "torchvision>=0.21,<1",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "threadpoolctl>=3.1,<4",
    "matplotlib>=3.8,<4",
    "PyYAML>=6,<7",
    "Pillow>=10,<13",
]

[project.scripts]
traceclean = "traceclean.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
